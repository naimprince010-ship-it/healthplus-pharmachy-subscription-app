name: Production smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS deployment URL to verify
        required: true
        default: https://halalzi.com

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run smoke:production -- "${{ inputs.base_url }}"
